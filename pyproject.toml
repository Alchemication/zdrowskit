[project]
name = "zdrowskit"
version = "0.1.0"
description = "What Apple Health notifications should be."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-auth==2.43.0",
    "kaleido==1.2.0",
    "litellm==1.95.0",
    "numpy==2.4.3",
    "plotly==6.6.0",
    "pydantic==2.12.5",
    "python-dotenv==1.0.1",
    "rich==14.3.3",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.15.6",
]
# Only needed to build the marketing site (`marketing/build.py`); the daemon and
# CLI never import these. markdown-it-py also arrives transitively via rich, but
# the site build pins it directly rather than relying on another package's dep.
site = [
    "markdown-it-py==4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
