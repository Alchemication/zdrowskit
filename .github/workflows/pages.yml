name: Public Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "marketing/**"
      - "docs/**"
      - "README.md"
      - "evals/leaderboard/**"
      - "evals/cases/**"
      - "uv.lock"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the leaderboard can diff each run's recorded commit
          # against HEAD and tell whether the code it measured has changed.
          # A shallow clone cannot resolve those shas and every row renders as
          # "staleness unknown".
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --group site

      - name: Build site
        # Renders the landing page, docs/*.md, and the leaderboard into _site/.
        # The leaderboard is rendered from runs.jsonl rather than copied from the
        # committed Markdown: the checked-in snapshot can lag the history it
        # summarises, and the published page should never be the stale one.
        run: uv run --group site python marketing/build.py --out _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
